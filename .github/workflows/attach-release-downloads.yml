name: Attach reviewed release downloads

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/attach-release-downloads.yml
      - releases/0.12.8-preview/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  attach:
    if: github.repository == 'Tubbritt/S56K-Editor'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read this release-only repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the reviewed package
        working-directory: releases/0.12.8-preview
        run: |
          printf '%s  %s\n' 'a17ec5a56754b8687c656cce5d94e0cb7b454af94bbd2704fdcc7b2d573d05e5' 'S56K-Editor-0.12.8-AutoSample-Preview-win64.zip' | sha256sum --check
          sha256sum --check S56K-Editor-0.12.8-AutoSample-Preview-win64.zip.sha256
      - name: Prepare draft release and attach verified downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.12.8-preview --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v0.12.8-preview \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --verify-tag \
              --title "S56K Editor 0.12.8 Auto Sample Preview" \
              --notes-file releases/v0.12.8-preview.md --draft --prerelease
          fi
          gh release upload v0.12.8-preview \
            releases/0.12.8-preview/S56K-Editor-0.12.8-AutoSample-Preview-win64.zip \
            releases/0.12.8-preview/S56K-Editor-0.12.8-AutoSample-Preview-win64.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --clobber
